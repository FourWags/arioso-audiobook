name: Publish Arioso preview 45

on:
  push:
    branches: [main]
    paths:
      - .release-input/preview45/**
      - .github/workflows/publish-preview45.yml

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'FourWags/arioso-audiobook'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild source archive from frozen manifest
        run: python3 .release-input/preview45/make-source-zip.py
      - name: Verify frozen release inputs
        working-directory: .release-input/preview45
        run: sha256sum -c SHA256SUMS
      - name: Publish signed Preview as Latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .release-input/preview45/publish-release.py
