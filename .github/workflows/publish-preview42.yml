name: Publish Arioso preview 42

on:
  push:
    branches: [main]
    paths:
      - .release-input/preview42/**
      - .github/workflows/publish-preview42.yml

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'FourWags/arioso-audiobook'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen release inputs
        working-directory: .release-input/preview42
        run: sha256sum -c SHA256SUMS
      - name: Publish signed Preview as Latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .release-input/preview42/publish-release.py
